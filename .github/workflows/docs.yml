name: docs
on:
  push:
    tags:
      - v*
    branches:
      - master
      - v2
  pull_request:
jobs:
  check-docs:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
    - uses: actions/cache@v6
      with:
        key: mkdocs-material-${{ env.cache_id }}
        path: .cache
        restore-keys: |
          mkdocs-material-
    - run: pip install mkdocs-material[imaging] mike
    - run: mkdocs build -s

  deploy-docs:
    # Pre-release tags (v2.11.0-rc.1, ...) must not be published to the docs
    # site, and especially must not move the "stable" alias.
    if: ${{ github.event_name != 'pull_request' && (github.ref_type != 'tag' || !contains(github.ref_name, '-')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'
    - uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.GH_PAGES_REPO_KEY }}
    - name: Configure Git
      run: |
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        # Deployed docs are in another repo for nice URLs
        git remote add gh-pages git@github.com:piraeusdatastore/docs.git
        git fetch gh-pages gh-pages --depth=1
    - uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
    - uses: actions/cache@v6
      with:
        key: mkdocs-material-${{ env.cache_id }}
        path: .cache
        restore-keys: |
          mkdocs-material-
    - run: pip install mkdocs-material[imaging] mike
    - name: Deploy latest docs
      if: ${{ github.ref_type == 'branch' }}
      run: mike deploy -u -r gh-pages -p v2 latest
    - name: Deploy release docs
      if: ${{ github.ref_type == 'tag' }}
      run: mike deploy -u -r gh-pages -p ${{ github.ref_name }} stable
